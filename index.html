<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2da95c" />
  <meta name="description" content="Uzhavan AI - Smart Farming Assistant for Indian Farmers" />
  <title>Uzhavan AI - உழவன் AI</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              'Noto Sans Tamil',
              'Noto Sans Tamil UI',
              'Tamil Sangam MN',
              'Tamil MN',
              'Noto Sans Telugu',
              'Noto Sans Devanagari',
              'Noto Sans Kannada',
              'Noto Sans Malayalam',
              'Inter',
              'Nirmala UI',
              'Latha',
              'Lohit Tamil',
              'Arial',
              'sans-serif'
            ],
          }
        }
      }
    };
  </script>

  <!-- Google Fonts (Inter + Noto Sans Indic languages + Noto Sans Tamil UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;500;600;700;800;900&family=Noto+Sans+Tamil+UI:wght@400;500;600;700;800;900&family=Noto+Sans+Telugu:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&family=Noto+Sans+Kannada:wght@400;500;600;700;800;900&family=Noto+Sans+Malayalam:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">

  <style>
    * {
      box-sizing: border-box;
    }

    body, html {
      font-family: 'Noto Sans Tamil', 'Noto Sans Tamil UI', 'Tamil Sangam MN', 'Tamil MN', 'Noto Sans Telugu', 'Noto Sans Devanagari', 'Noto Sans Kannada', 'Noto Sans Malayalam', 'Inter', 'Nirmala UI', 'Latha', 'Lohit Tamil', Arial, sans-serif;
      background-color: #f1f8f3;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      touch-action: manipulation;
      /* prevents double-tap zoom on mobile */
    }

    /* Regional language & Tamil font enforcement with fallbacks */
    .regional-font,
    .chat-bubble-text,
    .font-sans,
    .font-\[\'Inter\'\] {
      font-family: 'Noto Sans Tamil', 'Noto Sans Tamil UI', 'Tamil Sangam MN', 'Tamil MN', 'Noto Sans Telugu', 'Noto Sans Devanagari', 'Noto Sans Kannada', 'Noto Sans Malayalam', 'Inter', 'Nirmala UI', 'Latha', 'Lohit Tamil', Arial, sans-serif !important;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #f1f8f3;
      position: relative;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Hide scrollbar */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    /* Loading spinner for initial load */
    #root:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #root:empty::after {
      content: '';
      width: 40px;
      height: 40px;
      border: 4px solid #e0f0e5;
      border-top-color: #2da95c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
